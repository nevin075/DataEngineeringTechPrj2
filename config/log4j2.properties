# Quieter Spark logging for the Airflow task logs: Spark's own messages at WARN,
# our job loggers (Python) still print at INFO. Delete the -Dlog4j... option in the DAG
# (or set rootLogger.level = info) to see every Spark INFO line.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %p %c{1}: %m%n

# Keep a few useful lifecycle messages (app submitted, executors granted)
logger.standalone.name = org.apache.spark.deploy.client.StandaloneAppClient$ClientEndpoint
logger.standalone.level = info
logger.backend.name = org.apache.spark.scheduler.cluster.StandaloneSchedulerBackend
logger.backend.level = info
